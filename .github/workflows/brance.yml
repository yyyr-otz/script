name: Split Directories to Branches

on:
  workflow_dispatch:
  #push:
    #branches:[main]

jobs:
  split-directories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Split directories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          shopt -s dotglob nullglob
      
          # 修复后的目录获取命令
          dirs=$(find . -mindepth 1 -maxdepth 1 -type d \
            -not -name '.*' \
            -not -name '*.git*' \
            -exec bash -c 'echo "${1##*/}"' _ {} \;)
      
          echo "待处理目录: $dirs"
      
          for dir in $dirs; do
            echo "➡️ 正在处理: $dir"
            
            # 创建孤儿分支
            git checkout --orphan "${dir}"
            git commit --allow-empty -m "初始化分支结构" > /dev/null
            
            # 安全清理工作区
            git rm -qr --cached . > /dev/null
            find . -maxdepth 1 \
              ! -name "$dir" \
              ! -name '.git' \
              -exec rm -rf {} + 2>/dev/null || true
            
            # 移动目标目录内容到根目录
            if [ -d "$dir" ]; then
              mv "$dir"/{.,}* . 2>/dev/null || true
              rm -rf "$dir"
            fi
      
            # 提交变更
            git add -A
            if git commit -m "迁移内容: ${dir}" > /dev/null; then
              git push origin "${dir}" --force
              echo "✅ 分支 ${dir} 推送成功"
            else
              echo "⏩ 无内容变更: ${dir}"
              git checkout main
              git branch -D "${dir}"
            fi
            
            # 重置主分支
            git checkout main > /dev/null
            git reset --hard
            git clean -ffdx
          done
