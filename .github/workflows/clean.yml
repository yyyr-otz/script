name: 清除工作流运行记录
run-name: ${{ github.actor }} 正在执行清理
on:
  workflow_dispatch:
    inputs:
      days:
        description: '保留日志的天数'
        required: true
        default: '0.5'
      minimum_runs:
        description: '最少保留的运行记录数'
        required: true
        default: '2'
      delete_workflow_pattern:
        description: '目标工作流的名称或文件名（留空则处理所有工作流）'
        required: false
      delete_workflow_by_state_pattern:
        description: '按状态筛选工作流 (ALL/active/deleted/disabled_inactivity/disabled_manually)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually
      delete_run_by_conclusion_pattern:
        description: '按执行结果筛选要删除的运行记录 (ALL/action_required/cancelled/failure/skipped/success)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "action_required"
          - "cancelled"
          - "failure"
          - "skipped"
          - "success"
      dry_run:
        description: '模拟运行（不会实际删除）'
        required: false
        type: boolean

  schedule:
    - cron: '0 22 */3 * *'

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read  # 确保有读取仓库内容的权限
    steps:
      - name: 执行清理
        uses: InfraWay/delete-workflow-runs@v2.1.2
        with:
          token: ${{ github.token }}  # 使用正确的Token
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.days || 0.5 }}
          keep_minimum_runs: ${{ inputs.minimum_runs || 2 }}
          delete_workflow_pattern: ${{ inputs.delete_workflow_pattern || '' }}
          delete_workflow_by_state_pattern: ${{ inputs.delete_workflow_by_state_pattern }}
          # delete_run_by_conclusion_pattern: ${{ inputs.delete_run_by_conclusion_pattern }}
          delete_run_by_conclusion_pattern: >-
            ${{
              startsWith(inputs.delete_run_by_conclusion_pattern, 'Unsuccessful:')
              && 'action_required,cancelled,failure,skipped'
              || inputs.delete_run_by_conclusion_pattern
            }}
          dry_run: ${{ inputs.dry_run || false }}
