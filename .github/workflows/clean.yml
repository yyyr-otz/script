name: 清除工作流日志
run-name: ${{ github.actor }} 正在执行清理
on:
  workflow_dispatch:
    inputs:
      days:
        description: '日志保留天数'
        required: true
        default: '0.5'
      minimum_runs:
        description: '最少保留记录数'
        required: true
        default: '2'
      delete_workflow_pattern:
        description: '目标工作流名称/文件名（留空处理所有）'
        required: false
      delete_workflow_by_state_pattern:
        description: '按状态筛选 (ALL/active/deleted/disabled_*)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually
      delete_run_by_conclusion_pattern:
        description: '按结果筛选 (ALL/Unsuccessful:.../单个状态)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "Unsuccessful: action_required,cancelled,failure,skipped"
          - action_required
          - cancelled
          - failure
          - skipped
          - success
      dry_run:
        description: '模拟运行'
        required: false
        type: boolean

  schedule:
    - cron: '0 22 */3 * *'

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read  # 必须项
    steps:
      - name: 硬核删除模式
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: "ALL"
          dry_run: false  # 关闭模拟
