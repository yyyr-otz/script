name: 清除工作流日志
run-name: ${{ github.actor }} 正在清理过期工作流
on:
  # 手动触发配置
  workflow_dispatch:
    inputs:
      days:
        description: '每个工作流保留多少天的运行记录'
        required: true
        default: '0.5'
      minimum_runs:
        description: '每个工作流至少保留多少条运行记录'
        required: true
        default: '1'
      delete_workflow_pattern:
        description: '目标工作流的名称或文件名（留空则处理全部工作流）'
        required: false
      delete_workflow_by_state_pattern:
        description: '按状态过滤工作流'
        required: true
        default: '全部'
        type: choice
        options:
          - '全部'
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually
      delete_run_by_conclusion_pattern:
        description: '按执行结果过滤要删除的运行记录'
        required: true
        default: '全部'
        type: choice
        options:
          - '全部'
          - '仅失败：action_required,cancelled,failure,skipped'
          - action_required
          - cancelled
          - failure
          - skipped
          - success
      dry_run:
        description: '模拟运行模式（不会实际删除）'
        required: false
        type: boolean

  # 自动定时任务
  schedule:
    - cron: '30 21 */3 * *'

jobs:
  delete-runnner:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 执行日志清理
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days || 0.5 }}
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs || 1 }}
          delete_workflow_pattern: ${{ github.event.inputs.delete_workflow_pattern || '' }}
          delete_workflow_by_state_pattern: ${{ github.event.inputs.delete_workflow_by_state_pattern || '全部' }}
          delete_run_by_conclusion_pattern: >-
            ${{ 
              startsWith(github.event.inputs.delete_run_by_conclusion_pattern, '仅失败：') 
              && 'action_required,cancelled,failure,skipped' 
              || (github.event.inputs.delete_run_by_conclusion_pattern || '全部')
            }}
          dry_run: ${{ github.event.inputs.dry_run || false }}
