name: 清除工作流日志
run-name: ${{ github.actor }} 正在清理过期工作流
on:
  workflow_dispatch:
    inputs:
      days:
        description: '每个工作流保留日志的天数'
        required: true
        default: '0.2'
      minimum_runs:
        description: '每个工作流至少保留的日志数量'
        required: true
        default: '1'
      delete_workflow_pattern:
        description: '目标工作流的名称或文件名（留空则处理全部工作流）'
        required: false
      delete_workflow_by_state_pattern:
        description: '按状态筛选工作流 (ALL/active/deleted/disabled_inactivity/disabled_manually)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "active"
          - "deleted"
          - "disabled_inactivity"
          - "disabled_manually"
      delete_run_by_conclusion_pattern:
        description: '按执行结果筛选 (ALL/action_required/cancelled/failure/skipped/success)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "action_required"
          - "cancelled"
          - "failure"
          - "skipped"
          - "success"
      dry_run:
        description: '模拟运行（不会实际删除）'
        required: false
        type: boolean

  schedule:
    - cron: '30 21 */3 * *'

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 执行日志清理
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days || 0.2 }}
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs || 1 }}
          delete_workflow_pattern: ${{ github.event.inputs.delete_workflow_pattern || '' }}
          delete_workflow_by_state_pattern: ${{ github.event.inputs.delete_workflow_by_state_pattern }}
          delete_run_by_conclusion_pattern: ${{ github.event.inputs.delete_run_by_conclusion_pattern == 'ALL' && 'ALL' || github.event.inputs.delete_run_by_conclusion_pattern }}
          dry_run: ${{ github.event.inputs.dry_run || false }}
