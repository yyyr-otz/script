name: 清除日志
run-name: ${{ github.actor }} 正在清除runners
on:
  workflow_dispatch:    # 手动触发模式
    inputs:
      days:
        description: 'Days-worth of runs to keep for each workflow'
        required: true
        default: '0.5'
      minimum_runs:
        description: 'Minimum runs to keep for each workflow'
        required: true
        default: '1'
      delete_workflow_pattern:
        description: 'Name or filename of the workflow (if not set, all workflows are targeted)'
        required: false
      delete_workflow_by_state_pattern:
        description: 'Filter workflows by state'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually
      delete_run_by_conclusion_pattern:
        description: 'Remove runs based on conclusion'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "Unsuccessful: action_required,cancelled,failure,skipped"
          - action_required
          - cancelled
          - failure
          - skipped
          - success
      dry_run:
        description: 'Logs simulated changes, no deletions are performed'
        required: false
  schedule:              # 定时触发模式
    - cron: '30 22 */3 * *'  # 每3天 UTC 22:30（北京时间凌晨5点30）
      inputs:            # 继承手动触发默认参数
        days: '0.5'
        minimum_runs: '1'
        delete_workflow_by_state_pattern: "ALL"
        delete_run_by_conclusion_pattern: "ALL"

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 删除workflow日志
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days || 0.5 }}  # 兼容两种触发模式
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs || 2 }}
          delete_workflow_pattern: ${{ github.event.inputs.delete_workflow_pattern }}
          delete_workflow_by_state_pattern: ${{ github.event.inputs.delete_workflow_by_state_pattern || 'ALL' }}
          delete_run_by_conclusion_pattern: >-
            ${{ 
              startsWith(github.event.inputs.delete_run_by_conclusion_pattern, 'Unsuccessful:') 
              && 'action_required,cancelled,failure,skipped' 
              || (github.event.inputs.delete_run_by_conclusion_pattern || 'ALL')
            }}
          dry_run: ${{ github.event.inputs.dry_run || false }}
