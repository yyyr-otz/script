name: 清除工作流日志
run-name: ${{ github.actor }} 正在执行清理
on:
  workflow_dispatch:
    inputs:
      days:
        description: '日志保留天数'
        required: true
        default: '0.5'
      minimum_runs:
        description: '最少保留记录数'
        required: true
        default: '2'
      delete_workflow_pattern:
        description: '目标工作流名称/文件名（留空处理所有）'
        required: false
      delete_workflow_by_state_pattern:
        description: '按状态筛选 (ALL/active/deleted/disabled_*)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - active
          - deleted
          - disabled_inactivity
          - disabled_manually
      delete_run_by_conclusion_pattern:
        description: '按结果筛选 (ALL/Unsuccessful:.../单个状态)'
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL"
          - "Unsuccessful: action_required,cancelled,failure,skipped"
          - action_required
          - cancelled
          - failure
          - skipped
          - success
      dry_run:
        description: '模拟运行'
        required: false
        type: boolean

  schedule:
    - cron: '0 19 * * *'
      timezone: Asia/Shanghai

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read  # 新增必要权限
    steps:
      - name: 执行清理
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 显式声明token
          repository: ${{ github.repository }}
          retain_days: ${{ inputs.days || 0.5 }}  # 修复默认值写法
          keep_minimum_runs: ${{ inputs.minimum_runs || 2 }}
          delete_workflow_pattern: ${{ inputs.delete_workflow_pattern || '' }}
          delete_workflow_by_state_pattern: ${{ inputs.delete_workflow_by_state_pattern }}
          delete_run_by_conclusion_pattern: >-
            ${{ 
              inputs.delete_run_by_conclusion_pattern == 'Unsuccessful: action_required,cancelled,failure,skipped' 
              && 'action_required,cancelled,failure,skipped' 
              || inputs.delete_run_by_conclusion_pattern 
            }}
          dry_run: ${{ inputs.dry_run || false }}
