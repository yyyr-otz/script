name: 混淆最新版本源码
on:
    workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 使用 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: 安装依赖
        run: npm install -g javascript-obfuscator

      - name: 检查备份文件是否存在
        run: |
          if [ ! -f eooce-edgetunnel/_worker.js.backup ]; then
            echo "备份文件 eooce-edgetunnel/_worker.js.backup 不存在，正在创建..."
            cp eooce-edgetunnel/_worker.js eooce-edgetunnel/_worker.js.backup
          fi

      - name: 加载源码
        run: |
          curl -o eooce-edgetunnel/明文源码.js https://raw.githubusercontent.com/eooce/CF-Workers-VLESS/refs/heads/main/_worker.js

      - name: 混淆代码
        run: |
          javascript-obfuscator eooce-edgetunnel/明文源码.js --output eooce-edgetunnel/_worker.js \
          --compact true \
          --control-flow-flattening true \
          --control-flow-flattening-threshold 1 \
          --dead-code-injection true \
          --dead-code-injection-threshold 1 \
          --identifier-names-generator hexadecimal \
          --rename-globals true \
          --string-array true \
          --string-array-encoding 'rc4' \
          --string-array-threshold 1 \
          --transform-object-keys true \
          --unicode-escape-sequence true

      - name: 打包文件
        run: |
          cd eooce-edgetunnel && rm -f pages.zip && zip pages.zip _worker.js wrangler.toml

      - name: 提交更改
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add eooce-edgetunnel/_worker.js eooce-edgetunnel/_worker.js.backup eooce-edgetunnel/pages.zip
          if git diff --cached --quiet; then
            echo "没有文件更改，跳过提交"
          else
            git commit -m "混淆并打包 eooce-edgetunnel/_worker.js"
          fi

      - name: 推送更改
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: 清理
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.MYPAT }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
