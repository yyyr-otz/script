name: 更新自用二进制
run-name: 正在更新(${{ inputs.task || 'all' }})

on:
  workflow_dispatch:
    inputs:
      task:
        description: '输入任务名称（默认 all，支持空格或逗号分隔多个）'
        required: false
        default: 'all'
        type: string
      force:
        description: '是否强制更新（忽略版本比对）'
        required: false
        default: false
        type: boolean

jobs:
  update_release:
    runs-on: ubuntu-slim
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行更新脚本
        id: run_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_UPDATE: ${{ inputs.force || false }}
          WEBDAV_AUTH: ${{ secrets.WEBDAV_AUTH || secrets.WEBDAV_CONFIG }}
        run: |
          chmod +x release.sh
          bash release.sh "${{ inputs.task || 'all' }}"

      - name: 清理工作流历史
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.MYPAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
