name: 更新release文件
run-name: ${{ github.actor }} 正在更新release文件

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.1
      with:
        fetch-depth: 0

    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip jq

    - name: Get versions
      id: get_versions
      run: |
        # 获取Xray版本
        xray_version=$(curl -sL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.tag_name')
        echo "xray_version=${xray_version}" >> $GITHUB_OUTPUT
        
        # 获取Cloudflared版本
        cloudflared_version=$(curl -sL https://api.github.com/repos/cloudflare/cloudflared/releases/latest | jq -r '.tag_name')
        echo "cloudflared_version=${cloudflared_version}" >> $GITHUB_OUTPUT

    - name: Process Xray
      run: |
        # 定义所有Xray平台配置
        declare -A xray_platforms=(
          ["linux-arm64"]="Xray-linux-arm64-v8a.zip"
          ["linux-amd64"]="Xray-linux-64.zip"
          ["freebsd-arm64"]="Xray-freebsd-arm64-v8a.zip"
          ["freebsd-amd64"]="Xray-freebsd-64.zip"
        )

        mkdir -p xray-bin
        VERSION=${{ steps.get_versions.outputs.xray_version }}

        for tag in "${!xray_platforms[@]}"; do
          filename=${xray_platforms[$tag]}
          dir="$tag"  # 保留原始tag作为目录名

          echo "处理 $tag => $filename"
          curl -sL "https://github.com/XTLS/Xray-core/releases/download/$VERSION/$filename" -o "${filename}"
          mkdir -p "xray-bin/${dir}"
          unzip -j "${filename}" 'xray' -d "xray-bin/${dir}"
          chmod +x "xray-bin/${dir}/xray"
          rm "${filename}"
        done

    - name: Process Cloudflared
      run: |
        # Cloudflared平台配置
        declare -A cloudflared_platforms=(
          ["arm64"]="cloudflared-linux-arm64"
          ["amd64"]="cloudflared-linux-amd64"
        )

        mkdir -p cloudflared-bin
        VERSION=${{ steps.get_versions.outputs.cloudflared_version }}

        for tag in "${!cloudflared_platforms[@]}"; do
          filename=${cloudflared_platforms[$tag]}
          echo "处理 $tag => $filename"
          curl -sL "https://github.com/cloudflare/cloudflared/releases/download/$VERSION/$filename" -o "cloudflared-bin/$tag/argo"
          chmod +x "cloudflared-bin/$tag/argo"
        done

    - name: Update releases
      run: |
        # Xray发布配置
        declare -A xray_tags=(
          ["linux-arm64"]="arm64"
          ["linux-amd64"]="amd64"
          ["freebsd-arm64"]="freebsd-arm64"
          ["freebsd-amd64"]="freebsd-amd64"
        )

        for src_tag in "${!xray_tags[@]}"; do
          target_tag=${xray_tags[$src_tag]}
          gh release upload "$target_tag" "xray-bin/$src_tag/xray" --clobber
        done

        # Cloudflared发布配置
        declare -A cloudflared_tags=(
          ["arm64"]="arm64"
          ["amd64"]="amd64"
        )

        for src_tag in "${!cloudflared_tags[@]}"; do
          target_tag=${cloudflared_tags[$src_tag]}
          gh release upload "$target_tag" "cloudflared-bin/$src_tag/argo" --clobber
        done
