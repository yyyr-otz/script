name: Update Xray Releases

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点运行
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整提交历史以便处理tags

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Install GitHub CLI
      uses: azure/setup-gh-cli@v1

    - name: Configure git
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

    - name: Get latest Xray version
      id: get_version
      run: |
        LATEST_VERSION=$(curl -sL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.tag_name')
        echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

    - name: Read current version
      id: read_version
      run: |
        if [ -f version.txt ]; then
          CURRENT_VERSION=$(cat version.txt)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        else
          echo "current_version=" >> $GITHUB_OUTPUT
        fi

    - name: Check version update
      id: check_version
      run: |
        if [ "${{ steps.get_version.outputs.latest_version }}" != "${{ steps.read_version.outputs.current_version }}" ]; then
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "::set-output name=new_version::${{ steps.get_version.outputs.latest_version }}"
        else
          echo "proceed=false" >> $GITHUB_OUTPUT
        fi

    - name: Download and extract Xray
      if: steps.check_version.outputs.proceed == 'true'
      run: |
        mkdir -p xray-bin
        # 下载ARM64版本
        wget https://github.com/XTLS/Xray-core/releases/download/${{ steps.get_version.outputs.latest_version }}/Xray-linux-arm64-v8a.zip -O arm64.zip
        unzip -j arm64.zip 'xray' -d xray-bin/arm64
        rm arm64.zip
        chmod +x xray-bin/arm64/xray
        
        # 下载AMD64版本
        wget https://github.com/XTLS/Xray-core/releases/download/${{ steps.get_version.outputs.latest_version }}/Xray-linux-64.zip -O amd64.zip
        unzip -j amd64.zip 'xray' -d xray-bin/amd64
        rm amd64.zip
        chmod +x xray-bin/amd64/xray

    - name: Update ARM64 release
      if: steps.check_version.outputs.proceed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ARCH="arm64"
        FILE_PATH="xray-bin/$ARCH/xray"
        
        # 强制更新tag
        git tag -f $ARCH
        git push origin $ARCH -f
        
        # 创建或获取release
        if ! gh release view $ARCH; then
          gh release create $ARCH --title "$ARCH Build" --notes "Automated Xray $ARCH binary"
        fi
        
        # 删除已存在的xray文件
        ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/$ARCH | jq -r '.assets[] | select(.name == "xray").id')
        if [ -n "$ASSET_ID" ]; then
          gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
        fi
        
        # 上传新文件
        gh release upload $ARCH "$FILE_PATH" --clobber

    - name: Update AMD64 release
      if: steps.check_version.outputs.proceed == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ARCH="amd64"
        FILE_PATH="xray-bin/$ARCH/xray"
        
        # 强制更新tag
        git tag -f $ARCH
        git push origin $ARCH -f
        
        # 创建或获取release
        if ! gh release view $ARCH; then
          gh release create $ARCH --title "$ARCH Build" --notes "Automated Xray $ARCH binary"
        fi
        
        # 删除已存在的xray文件
        ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/$ARCH | jq -r '.assets[] | select(.name == "xray").id')
        if [ -n "$ASSET_ID" ]; then
          gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
        fi
        
        # 上传新文件
        gh release upload $ARCH "$FILE_PATH" --clobber

    - name: Update version record
      if: steps.check_version.outputs.proceed == 'true'
      run: |
        echo "${{ steps.get_version.outputs.latest_version }}" > version.txt
        git add version.txt
        git commit -m "chore: Update Xray version [skip ci]"
        git push
