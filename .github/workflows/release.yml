name: 更新自用二进制
run-name: ${{ github.actor }} 正在更新release文件 (${{ inputs.task || 'all' }})

on:
  workflow_dispatch:
    inputs:
      task:
        description: '选择需要执行的任务（默认 all 为全量增量更新）'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - eooce
          - rules
          - agent
          - dashboard
          - xray
          - alist
          - argo
          - mosdns4
          - mosdns5
          - gost
          - wireproxy
          - aria2
          - dpanel
      force:
        description: '是否强制更新（忽略版本比对）'
        required: false
        default: false
        type: boolean

jobs:
  update_release:
    runs-on: ubuntu-slim
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行更新脚本
        id: run_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_UPDATE: ${{ inputs.force || false }}
          WEBDAV_AUTH: ${{ secrets.WEBDAV_AUTH || secrets.WEBDAV_CONFIG }}
        run: |
          chmod +x release.sh
          bash release.sh "${{ inputs.task || 'all' }}"

      - name: 清理工作流历史
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.MYPAT || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
