name: 更新自用二进制
run-name: ${{ github.actor }} 正在更新release文件

on:
  workflow_dispatch:

jobs:
  update_release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: ["eooce", "agent", "dashboard", "xray", "alist", "argo", "mosdns4", "mosdns5"]
      fail-fast: false # 保证某个软件失败不会直接阻断其他任务
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 执行更新脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/release.sh
          ./scripts/release.sh "${{ matrix.task }}"

      - name: 清理工作流历史
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.MYPAT }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
