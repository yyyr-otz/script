name: Nuitka Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            triplet: x86_64-linux-gnu
            dpkg_arch: amd64
            gcc_path: /usr/bin/x86_64-linux-gnu-gcc-11  # 实际存在的编译器路径
          - arch: arm64
            triplet: aarch64-linux-gnu
            dpkg_arch: arm64
            gcc_path: /usr/bin/aarch64-linux-gnu-gcc-11
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Multiarch Toolchain
        run: |
          # 启用目标架构支持
          sudo dpkg --add-architecture ${{ matrix.dpkg_arch }}
          sudo add-apt-repository -y universe
          sudo apt-get update

          # 安装工具链（自动处理符号链接）
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-${{ matrix.dpkg_arch }} \
            binutils-${{ matrix.triplet }} \
            musl-dev \
            patchelf \
            file \
            python3-dev

          # 仅当目标编译器存在时配置alternatives
          if [ -f "${{ matrix.gcc_path }}" ]; then
            sudo update-alternatives --install \
              /usr/bin/${{ matrix.triplet }}-gcc \
              ${{ matrix.triplet }}-gcc \
              ${{ matrix.gcc_path }} 100

            sudo update-alternatives --install \
              /usr/bin/${{ matrix.triplet }}-g++ \
              ${{ matrix.triplet }}-g++ \
              ${${ matrix.gcc_path }/gcc/g++} 100
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==2.6.9 staticx
          pip install -r alist-tgbot-py/requirements.txt

      - name: Build with Nuitka
        env:
          CC: "/usr/bin/${{ matrix.triplet }}-gcc"
          CXX: "/usr/bin/${{ matrix.triplet }}-g++"
          CFLAGS: "-static -fstack-protector-strong"
          LDFLAGS: "-static -Wl,--strip-all"
        run: |
          cd alist-tgbot-py
          ${{ env.pythonLocation }}/bin/python -m nuitka \
            --onefile \
            --include-package=requests \
            --include-package=urllib3 \
            --include-package=chardet \
            --include-package=idna \
            --include-package=charset_normalizer \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=./build \
            --lto=no \
            tgbot.py

          staticx --strip ./build/tgbot.dist/tgbot ./build/tgbot-static
          mkdir -p ../dist/${{ matrix.arch }}
          mv ./build/tgbot-static ../dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Binary Verification
        run: |
          # 架构验证
          file ./dist/${{ matrix.arch }}/alist-tgbot-py | grep "${{ matrix.triplet }}"
          # 静态链接检查
          ! ldd ./dist/${{ matrix.arch }}/alist-tgbot-py 2>&1 | grep "=>"
          # 文件属性检查
          checksec --file=./dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ matrix.arch }}"
          BINARY_PATH="./dist/${{ matrix.arch }}/alist-tgbot-py"
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
