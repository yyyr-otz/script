name: Static Build (alist-tgbot-py)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools python3-pip

      - name: Prepare libc.so
        run: |
          # 将 musl 的 libc.so 复制到项目目录
          mkdir -p lib
          cp /usr/lib/x86_64-linux-musl/libc.so lib/

      - name: Build with musl-gcc
        env:
          CC: musl-gcc  # 强制使用 musl 编译器
        run: |
          pip install pyinstaller
          pyinstaller --onefile \
            --name alist-tgbot \
            --add-binary "lib/libc.so:." \  # 关键：使用相对路径
            --workpath build \
            --distpath dist \
            alist-tgbot/tgbot.py

      - name: Verify static binary
        run: |
          ldd dist/alist-tgbot | grep "not a dynamic executable" || (echo "Binary is not static!"; exit 1)

      - name: Upload to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "static" --title "Static Build" --notes "Musl-compiled binary" || true
          gh release upload "static" dist/alist-tgbot --clobber
