name: Static Build (alist-tgbot-py)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up static build environment
        run: |
          # 安装 musl 工具链
          sudo apt-get install -y musl-tools

      - name: Build with static linking
        run: |
          # 使用 musl-gcc 替代默认 gcc
          export CC=musl-gcc
          pip install --user pyinstaller
          pyinstaller --onefile \
            --name alist-tgbot \
            --workpath build \
            --distpath dist \
            --add-binary "/usr/lib/x86_64-linux-musl/libc.so:/lib" \
            alist-tgbot/tgbot.py

      - name: Verify static binary
        run: |
          ldd dist/alist-tgbot  # 应输出 "not a dynamic executable"

      - name: Upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "static" \
            dist/alist-tgbot \
            --clobber
