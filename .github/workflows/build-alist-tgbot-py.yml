name: Universal Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ matrix.arch }}-${{ hashFiles('Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-buildx-${{ matrix.arch }}-
          ${{ runner.os }}-buildx-

    - name: Build for ${{ matrix.arch }}
      uses: docker/build-push-action@v5
      with:
        platforms: linux/${{ matrix.arch }}
        context: .
        file: alist-tgbot-py/Dockerfile
        outputs: type=local,dest=./dist/linux_${{ matrix.arch }}
        build-args: |
          TARGETPLATFORM=linux/${{ matrix.arch }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate Binary
      run: |
        file ./dist/linux_${{ matrix.arch }}/alist-tgbot-py-static | grep "statically linked"
        ldd ./dist/linux_${{ matrix.arch }}/alist-tgbot-py-static 2>&1 | grep "not a dynamic executable"


    - name: Upload to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RELEASE_TAG="${{ matrix.arch }}"
        BINARY_PATH="./dist/linux_${{ matrix.arch }}/alist-tgbot-py"
        gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
