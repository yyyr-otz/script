name: Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build static binary
        uses: docker/build-push-action@v4
        with:
          platforms: linux/${{ matrix.arch }}
          # 关键修复：使用正确的 Dockerfile 语法
          context: .
          file: alist-tgbot/Dockerfile  # 独立存放 Dockerfile
          outputs: type=local,dest=./dist

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 生成唯一 Release 标题
          RELEASE_TAG="${{ matrix.arch }}"
          BINARY_PATH="dist/linux_${{ matrix.arch }}/alist-tgbot"
          
          # 创建或更新 Release
          gh release create $RELEASE_TAG \
            --title "Build for $RELEASE_TAG" \
            --notes "Static build for ${{ matrix.arch }} architecture" \
            $BINARY_PATH
