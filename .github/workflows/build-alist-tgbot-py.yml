name: Static Cross-Compile Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable multiarch support
        run: |
          # 关键修复：启用多架构支持
          sudo dpkg --add-architecture arm64
          sudo apt-get update

      - name: Install cross-compile tools
        run: |
          sudo apt-get install -y \
            musl-tools \
            gcc-aarch64-linux-gnu \
            gcc-x86-64-linux-gnu \
            musl-dev:arm64 \        # 显式安装ARM64 musl库
            qemu-user-static

      - name: Prepare musl libc
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              MUSL_PATH="/usr/lib/x86_64-linux-musl/libc.so"
              ;;
            arm64)
              MUSL_PATH="/usr/lib/aarch64-linux-musl/libc.so"
              ;;
          esac

          mkdir -p lib
          echo "Copying musl libc from: $MUSL_PATH"
          ls -l $MUSL_PATH  # 新增路径验证
          cp -v $MUSL_PATH lib/

      - name: Set compiler flags
        id: set-env
        run: |
          # ARM64需要指定库搜索路径
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "C_INCLUDE_PATH=/usr/aarch64-linux-musl/include" >> $GITHUB_ENV
            echo "LIBRARY_PATH=/usr/aarch64-linux-musl/lib" >> $GITHUB_ENV
          fi

      - name: Static build
        env:
          CC: |
            ${{ matrix.arch == 'amd64' && 'x86_64-linux-musl-gcc' || 'aarch64-linux-musl-gcc -B /usr/aarch64-linux-musl/lib' }}
        run: |
          pip install -r alist-tgbot/requirements.txt
          pyinstaller \
            --onefile \
            --name alist-tgbot \
            --add-binary "lib/libc.so:." \
            --workpath build \
            --distpath dist \
            alist-tgbot/tgbot.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag: ${{ matrix.arch }}
          files: dist/alist-tgbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
