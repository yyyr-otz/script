name: Static Cross-Compile Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup cross-compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            gcc-aarch64-linux-gnu \
            gcc-x86-64-linux-gnu \
            qemu-user-static  # 启用ARM64二进制模拟

      - name: Prepare musl libc
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              MUSL_PATH="/usr/lib/x86_64-linux-musl/libc.so"
              ;;
            arm64)
              MUSL_PATH="/usr/lib/aarch64-linux-musl/libc.so"
              ;;
          esac

          mkdir -p lib
          echo "Copying musl libc from: $MUSL_PATH"
          cp $MUSL_PATH lib/

      - name: Verify musl path
        run: |
          ls -l lib/libc.so
          file lib/libc.so

      - name: Static build
        env:
          CC: |
            if [ "${{ matrix.arch }}" = "amd64" ]; then
              echo "x86_64-linux-musl-gcc"
            else
              echo "aarch64-linux-musl-gcc"
            fi
        run: |
          pip install -r alist-tgbot/requirements.txt
          pyinstaller --onefile \
            --name alist-tgbot \
            --add-binary "lib/libc.so:." \
            --workpath build \
            --distpath dist \
            alist-tgbot/tgbot.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag: ${{ matrix.arch }}
          files: dist/alist-tgbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
