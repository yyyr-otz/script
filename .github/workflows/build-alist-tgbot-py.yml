name: Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            network=host

      - name: Build for ${{ matrix.arch }}
        uses: docker/build-push-action@v4
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: alist-tgbot-py/Dockerfile
          outputs: type=local,dest=./dist/linux_${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TARGETPLATFORM=linux/${{ matrix.arch }}

      - name: Verify build output
        run: |
          echo "构建产物路径结构:"
          ls -R ./dist
          echo "确认二进制文件存在:"
          find ./dist -name alist-tgbot-py

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 动态获取二进制文件路径
          BINARY_PATH="./dist/linux_${{ matrix.arch }}/alist-tgbot-py"
          RELEASE_TAG="${{ matrix.arch }}"
          
          # 确保Release存在，如果不存在则创建
          #if ! gh release list | grep -q "$RELEASE_TAG"; then
          #  gh release create "$RELEASE_TAG" --title "AList-TGBot-Py ($RELEASE_TAG)" --notes "Static build for $RELEASE_TAG"
          #fi
          
          # 上传文件并覆盖同名文件
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
