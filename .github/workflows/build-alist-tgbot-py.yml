name: Nuitka Static Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            triplet: x86_64-linux-gnu
            debian_arch: amd64
            binutils_pkg: binutils-x86-64-linux-gnu
          - arch: arm64
            triplet: aarch64-linux-gnu
            debian_arch: arm64
            binutils_pkg: binutils-aarch64-linux-gnu
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Multiarch Toolchain
        run: |
          # 启用目标架构支持
          sudo dpkg --add-architecture ${{ matrix.debian_arch }}
          sudo add-apt-repository -y universe
          sudo apt-get update

          # 安装编译工具链（修正包名）
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-${{ matrix.debian_arch }} \
            ${{ matrix.binutils_pkg }} \
            musl-dev \
            patchelf \
            file \
            python3-dev \
            gcc-${{ matrix.triplet }} \
            g++-${{ matrix.triplet }}

          # 配置编译器优先级
          sudo update-alternatives --install \
            /usr/bin/${{ matrix.triplet }}-gcc \
            ${{ matrix.triplet }}-gcc \
            /usr/bin/${{ matrix.triplet }}-gcc 100

          sudo update-alternatives --install \
            /usr/bin/${{ matrix.triplet }}-g++ \
            ${{ matrix.triplet }}-g++ \
            /usr/bin/${{ matrix.triplet }}-g++ 100

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==2.6.9 staticx
          pip install -r alist-tgbot-py/requirements.txt

      - name: Build with Nuitka
        env:
          CC: "/usr/bin/${{ matrix.triplet }}-gcc"
          CXX: "/usr/bin/${{ matrix.triplet }}-g++"
          CFLAGS: "-static -fstack-protector-strong"
          LDFLAGS: "-static -Wl,--strip-all"
        run: |
          cd alist-tgbot-py
          ${{ env.pythonLocation }}/bin/python -m nuitka \
            --onefile \
            --include-package=requests \
            --include-package=urllib3 \
            --include-package=chardet \
            --include-package=idna \
            --include-package=charset_normalizer \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=./build \
            --lto=no \
            tgbot.py

          staticx --strip ./build/tgbot.dist/tgbot ./build/tgbot-static
          mkdir -p ../dist/${{ matrix.arch }}
          mv ./build/tgbot-static ../dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Binary Verification
        run: |
          echo "架构验证:"
          file ./dist/${{ matrix.arch }}/alist-tgbot-py | grep -E "${{ matrix.triplet }}|statically linked"
          echo "动态库检查:"
          ! ldd ./dist/${{ matrix.arch }}/alist-tgbot-py 2>&1 | grep "=>"
          echo "安全加固检查:"
          checksec --file=./dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ matrix.arch }}"
          BINARY_PATH="./dist/${{ matrix.arch }}/alist-tgbot-py"
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
