name: Nuitka Static Build

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            zig_target: x86_64-linux-musl
          - arch: arm64
            zig_target: aarch64-linux-musl
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Setup Zig
      uses: mlugg/setup-zig@v1.2.1
      with:
        version: "0.13.0"  # 升级至更稳定版本

    - name: Install system compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc \
          g++ \
          make \
          scons \
          patchelf \
          zlib1g-dev

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: pip

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install nuitka==2.6.9 staticx
        pip install -r alist-tgbot-py/requirements.txt

    - name: Build with Nuitka
      env:
        CC: "zig cc -target ${{ matrix.zig_target }}"
        CXX: "zig c++ -target ${{ matrix.zig_target }}"
        # 移除强制静态标志，由staticx处理最终静态化
        LDFLAGS: ""
        CFLAGS: "-fstack-protector-strong"
      run: |
        cd alist-tgbot-py
        
        # 生成动态链接的可执行文件
        python -m nuitka \
          --onefile \
          --include-package=requests \
          --include-package=urllib3 \
          --include-package=chardet \
          --include-package=idna \
          --include-package=charset_normalizer \
          --standalone \
          --assume-yes-for-downloads \
          --output-dir=./build \
          --lto=no \
          --clang \
          tgbot.py

        # 使用staticx进行静态化
        staticx --strip ./build/tgbot.bin ./build/tgbot-static

        # 组织输出文件
        mkdir -p ../dist/${{ matrix.arch }}
        mv ./build/tgbot-static ../dist/${{ matrix.arch }}/alist-tgbot-py

    - name: Verify binary
      run: |
        echo "文件类型:"
        file ./dist/${{ matrix.arch }}/alist-tgbot-py
        echo -n "目标架构: " 
        readelf -h ./dist/${{ matrix.arch }}/alist-tgbot-py | grep 'Machine'
        echo "动态链接检查:"
        ldd ./dist/${{ matrix.arch }}/alist-tgbot-py 2>&1 | grep "not a dynamic executable"

    - name: Upload to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RELEASE_TAG="${{ matrix.arch }}"
        BINARY_PATH="./dist/${{ matrix.arch }}/alist-tgbot-py"
        gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
