name: Static Cross-Compile Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            zig_target: x86_64-linux-musl
            release_tag: linux-amd64
          - arch: arm64
            zig_target: aarch64-linux-musl
            release_tag: linux-arm64
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
          cache-image: true

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v1.2.1
        with:
          version: "0.12.0"
          use-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-pip \
            python3-venv \
            zlib1g-dev \
            libffi-dev \
            libjpeg-dev \
            libssl-dev \
            musl-tools \
            patchelf \
            scons

      - name: Configure Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r alist-tgbot-py/requirements.txt
          pip install "pyinstaller==6.11.0" "staticx>=0.13.0" "zigpy>=0.12.0"
          pip install --force-reinstall --no-deps \
            "urllib3>=2.0.7" \
            "chardet>=5.2.0" \
            "idna>=3.6"

      - name: Build executable
        env:
          CC: "zig cc -target ${{ matrix.zig_target }}"
          CXX: "zig c++ -target ${{ matrix.zig_target }}"
          LDFLAGS: "-static"
          CFLAGS: "-static -fstack-protector-strong"
        run: |
          source venv/bin/activate
          cd alist-tgbot-py

          BOOTLOADER_PATH=$(python -c "from PyInstaller.bootstrap import run; print(run.__file__)")

          pyinstaller \
            --onefile \
            --name alist-tgbot-py \
            --hidden-import urllib3 \
            --hidden-import chardet \
            --hidden-import idna \
            --hidden-import charset_normalizer \
            --collect-all requests \
            --collect-all urllib3 \
            --collect-all chardet \
            --collect-all idna \
            --add-data "$(python -c 'import requests; print(requests.__path__[0])'):requests" \
            --workpath /tmp/build \
            --distpath ../dist/${{ matrix.arch }} \
            --specpath /tmp/spec \
            --clean \
            --runtime-tmpdir . \
            --bootloader $BOOTLOADER_PATH \
            tgbot.py

          # Staticx 静态化处理
          staticx --loglevel DEBUG \
            --strip \
            ../dist/${{ matrix.arch }}/alist-tgbot-py \
            ../dist/${{ matrix.arch }}/alist-tgbot-py-static
            
          mkdir -p ../dist/${{ matrix.arch }}/static
          mv ../dist/${{ matrix.arch }}/alist-tgbot-py-static ../dist/${{ matrix.arch }}/static/alist-tgbot-py

      - name: Verify binary
        run: |
          readelf -h ./dist/${{ matrix.arch }}/static/alist-tgbot-py | grep 'Machine' | grep -E 'AArch64|Advanced Micro Devices X86-64'
          file ./dist/${{ matrix.arch }}/static/alist-tgbot-py | grep "statically linked"
          ldd ./dist/${{ matrix.arch }}/static/alist-tgbot-py 2>&1 | grep "not a dynamic executable"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ matrix.arch }}"
          BINARY_PATH="./dist/${{ matrix.arch }}/static/alist-tgbot-py"
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
