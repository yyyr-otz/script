name: Nuitka Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            zig_target: x86_64-linux-musl
            release_tag: linux-amd64
          - arch: arm64
            zig_target: aarch64-linux-musl
            release_tag: linux-arm64
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1.2.1
        with:
          version: "0.12.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-venv \
            patchelf \
            zlib1g-dev

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build and package
        env:
          CC: "zig cc -target ${{ matrix.zig_target }}"
          CXX: "zig c++ -target ${{ matrix.zig_target }}"
          LDFLAGS: "-static"
          CFLAGS: "-static -fstack-protector-strong"
        run: |
          cd alist-tgbot-py

          # 创建虚拟环境
          python -m venv venv
          source venv/bin/activate

          # 安装依赖
          pip install --upgrade pip
          pip install nuitka staticx
          pip install -r requirements.txt

          # 编译
          python -m nuitka \
            --onefile \
            --include-package=requests \
            --include-package=urllib3 \
            --include-package=chardet \
            --include-package=idna \
            --include-package=charset_normalizer \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=./build \
            --lto=no \
            tgbot.py

          # 静态化处理
          staticx --strip ./build/tgbot ./build/tgbot-static

          # 准备输出
          mkdir -p ../dist/${{ matrix.arch }}
          mv ./build/tgbot-static ../dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Verify binary
        run: |
          file ./dist/${{ matrix.arch }}/alist-tgbot-py
          readelf -h ./dist/${{ matrix.arch }}/alist-tgbot-py | grep 'Machine'
          ldd ./dist/${{ matrix.arch }}/alist-tgbot-py 2>&1 | grep "not a dynamic executable"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: alist-tgbot-${{ matrix.arch }}
          path: ./dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ matrix.arch }}"
          BINARY_PATH="./dist/${{ matrix.arch }}/alist-tgbot-py"
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
