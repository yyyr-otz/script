name: Static Build (alist-tgbot-py)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r alist-tgbot/requirements.txt
          pip install pyinstaller
          
      - name: Set up musl toolchain
        run: |
          # 安装 musl 工具链和依赖
          sudo apt-get update
          sudo apt-get install -y musl-tools python3-pip

      - name: Build with static linking
        run: |
          # 使用 musl-gcc 替代默认 GCC
          export CC=musl-gcc

          # 确保将 libc.so 复制到相对路径
          mkdir -p lib
          cp /usr/lib/x86_64-linux-musl/libc.so lib/

          # 静态编译并修正路径
          pyinstaller --onefile \
            --name alist-tgbot \
            --add-binary "lib/libc.so:." \  # 使用相对路径
            --workpath build \
            --distpath dist \
            alist-tgbot/tgbot.py

      - name: Verify static binary
        run: |
          ldd dist/alist-tgbot  # 应输出 "not a dynamic executable"

      - name: Upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "static" \
            dist/alist-tgbot \
            --clobber
