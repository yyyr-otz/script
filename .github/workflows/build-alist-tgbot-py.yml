name: build-alist-tgbot-py

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build binary
        run: |
          pyinstaller --onefile \
            --name alist-tgbot \
            --workpath build/${{ matrix.arch }} \
            --distpath dist/${{ matrix.arch }} \
            alist-tgbot/tgbot.py

      - name: Create Release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ matrix.arch }}"; then
            gh release create "${{ matrix.arch }}" \
              --title "${{ matrix.arch }}" \
              --notes "Auto-generated for ${{ matrix.arch }}"
          fi

      - name: Upload Binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ matrix.arch }}" \
            "dist/${{ matrix.arch }}/alist-tgbot" \
            --clobber
