name: Static Cross-Compile Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            zig_target: x86_64-linux-musl
            release_tag: linux-amd64
          - arch: arm64
            zig_target: aarch64-linux-musl
            release_tag: linux-arm64
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
          cache-image: true

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v1.2.1
        with:
          version: "0.12.0"
          use-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-pip \
            python3-venv \
            zlib1g-dev \
            libffi-dev \
            libjpeg-dev \
            libssl-dev \
            musl-tools \
            patchelf \
            scons \
            gcc \
            g++ \
            make

      - name: Configure Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r alist-tgbot-py/requirements.txt
          pip install "nuitka>=1.5.8" "staticx>=0.13.0" "zigpy>=0.12.0" "setuptools>=68.2.2"
          pip install --force-reinstall --no-deps \
            "urllib3>=2.0.7" \
            "chardet>=5.2.0" \
            "idna>=3.6"

      - name: Build executable
        env:
          CC: "zig cc -target ${{ matrix.zig_target }}"
          CXX: "zig c++ -target ${{ matrix.zig_target }}"
          LDFLAGS: "-static"
          CFLAGS: "-static -fstack-protector-strong"
          _PYTHON_HOST_PLATFORM: "linux-${{ matrix.arch }}"
        run: |
          source venv/bin/activate
          cd alist-tgbot-py

          # 使用Nuitka编译Python脚本
          python -m nuitka \
            --onefile \
            --enable-plugin=nuitka.plugins.PluginNoUnhashable \
            --include-package=requests \
            --include-package=urllib3 \
            --include-package=chardet \
            --include-package=idna \
            --include-package=charset_normalizer \
            --static-libraries \
            --standalone \
            --enable-unsupported-optimization \
            tgbot.py

          # 静态化处理
          staticx --loglevel DEBUG \
            --strip \
            tgbot \
            tgbot-static

          # 创建输出目录
          mkdir -p ../dist/${{ matrix.arch }}/static
          mv tgbot-static ../dist/${{ matrix.arch }}/static/alist-tgbot-py

      - name: Verify binary
        run: |
          echo "验证 ${{ matrix.arch }} 架构:"
          readelf -h ./dist/${{ matrix.arch }}/static/alist-tgbot-py | grep 'Machine' | grep -E 'AArch64|Advanced Micro Devices X86-64'
          file ./dist/${{ matrix.arch }}/static/alist-tgbot-py | grep "statically linked"
          ldd ./dist/${{ matrix.arch }}/static/alist-tgbot-py 2>&1 | grep "not a dynamic executable"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ matrix.release_tag }}"
          BINARY_PATH="./dist/${{ matrix.arch }}/static/alist-tgbot-py"
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
