name: Nuitka Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            debian_arch: amd64
            triplet: x86_64-linux-gnu
            gcc_version: 11
          - arch: arm64
            debian_arch: arm64
            triplet: aarch64-linux-gnu
            gcc_version: 11
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Multiarch Toolchain
        run: |
          # 启用多架构支持
          sudo dpkg --add-architecture ${{ matrix.debian_arch }}
          sudo add-apt-repository -y universe
          sudo apt-get update -qq

          # 安装交叉编译工具链（修正包名格式）
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-${{ matrix.debian_arch }} \
            binutils-${{ matrix.triplet }} \
            gcc-${{ matrix.gcc_version }}-${{ matrix.triplet }} \
            g++-${{ matrix.gcc_version }}-${{ matrix.triplet }} \
            musl-tools \
            patchelf \
            file

          # 配置编译器优先级
          sudo update-alternatives --install \
            /usr/bin/${{ matrix.triplet }}-gcc \
            ${{ matrix.triplet }}-gcc \
            /usr/bin/${{ matrix.triplet }}-gcc-${{ matrix.gcc_version }} 100

          sudo update-alternatives --install \
            /usr/bin/${{ matrix.triplet }}-g++ \
            ${{ matrix.triplet }}-g++ \
            /usr/bin/${{ matrix.triplet }}-g++-${{ matrix.gcc_version }} 100

      - name: Verify Toolchain
        run: |
          echo "Installed compilers:"
          /usr/bin/${{ matrix.triplet }}-gcc --version
          /usr/bin/${{ matrix.triplet }}-g++ --version
          
          echo "Binary tools:"
          dpkg -L binutils-${{ matrix.triplet }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install nuitka==2.6.9 staticx
          pip install -r alist-tgbot-py/requirements.txt

      - name: Build with Nuitka
        env:
          CC: "/usr/bin/${{ matrix.triplet }}-gcc"
          CXX: "/usr/bin/${{ matrix.triplet }}-g++"
          CFLAGS: "-static -fstack-protector-strong"
          LDFLAGS: "-static -Wl,--strip-all"
        run: |
          cd alist-tgbot-py
          python -m nuitka \
            --onefile \
            --include-package=requests \
            --include-package=urllib3 \
            --include-package=chardet \
            --include-package=idna \
            --include-package=charset_normalizer \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=./build \
            --lto=no \
            tgbot.py

          staticx --strip ./build/tgbot.dist/tgbot ./build/tgbot-static
          mkdir -p ../dist/${{ matrix.arch }}
          mv ./build/tgbot-static ../dist/${{ matrix.arch }}/alist-tgbot-py
