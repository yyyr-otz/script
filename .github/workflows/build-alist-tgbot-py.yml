name: Static Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-latest-arm

    jobs:
      build:
        runs-on: ${{ matrix.runner }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Setup Docker Buildx
            uses: docker/setup-buildx-action@v2

          - name: Build static binary
            uses: docker/build-push-action@v4
            with:
              platforms: linux/${{ matrix.arch }}
              context: .
              file: alist-tgbot-py/Dockerfile
              outputs: type=local,dest=./dist/linux_${{ matrix.arch }}

          - name: Verify build output
            run: |
              echo "构建产物路径结构:"
              ls -R ./dist
              echo "确认二进制文件存在:"
              find ./dist -name alist-tgbot-py

          - name: Upload to Release
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              BINARY_PATH="./dist/linux_${{ matrix.arch }}/alist-tgbot-py"
              RELEASE_TAG="${{ matrix.arch }}"
              
              # 确保Release存在，如果不存在则创建
              #if ! gh release list | grep -q "$RELEASE_TAG"; then
              #  gh release create "$RELEASE_TAG" --title "AList-TGBot-Py ($RELEASE_TAG)" --notes "Static build for $RELEASE_TAG"
              #fi
              
              # 上传文件并覆盖同名文件
              gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
