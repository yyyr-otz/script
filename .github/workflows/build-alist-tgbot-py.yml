name: Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64v8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build static binary
        uses: docker/build-push-action@v4
        with:
          platforms: linux/${{ matrix.arch }}
          file: |
            # 第一阶段：构建Python环境
            FROM --platform=$TARGETPLATFORM alpine:3.18 AS builder
            WORKDIR /app
            RUN apk add --no-cache \
                musl-dev \
                gcc \
                python3-dev \
                py3-pip
            COPY alist-tgbot/requirements.txt .
            RUN pip install --user --no-compile -r requirements.txt
            COPY alist-tgbot .
            
            # 第二阶段：静态编译
            FROM --platform=$TARGETPLATFORM alpine:3.18
            WORKDIR /app
            COPY --from=builder /root/.local /usr/local
            COPY --from=builder /app/tgbot.py .
            
            # 安装pyinstaller
            RUN apk add --no-cache py3-pip && \
                pip install pyinstaller
            
            # 验证文件存在性
            RUN ls -l tgbot.py
            
            # 使用pyinstaller生成可执行文件
            RUN pyinstaller --onefile \
                --name alist-tgbot \
                --workpath build \
                --distpath dist \
                tgbot.py

            # 指定输出路径
            WORKDIR /app/dist
            
          outputs: type=local,dest=./dist

      - name: Verify binary
        run: |
          file dist/linux_${{ matrix.arch }}/alist-tgbot
          ldd dist/linux_${{ matrix.arch }}/alist-tgbot | grep "not a dynamic executable"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag: ${{ matrix.arch }}
          files: |
            dist/linux_${{ matrix.arch }}/alist-tgbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
