name: Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64v8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build static binary
        uses: docker/build-push-action@v4
        with:
          platforms: linux/${{ matrix.arch }}
          file: |
            # 第一阶段：基于Alpine构建Python环境
            FROM --platform=$TARGETPLATFORM alpine:3.18 AS builder
            RUN apk add --no-cache \
                musl-dev \
                gcc \
                python3-dev \
                py3-pip
            WORKDIR /app
            COPY alist-tgbot/requirements.txt .
            RUN pip install --user --no-compile -r requirements.txt

            # 第二阶段：静态编译
            FROM --platform=$TARGETPLATFORM alpine:3.18
            COPY --from=builder /root/.local /usr/local
            COPY alist-tgbot/tgbot.py .
            RUN apk add --no-cache py3-pip && \
                pip install pyinstaller && \
                pyinstaller --onefile \
                  --name alist-tgbot \
                  --workpath build \
                  --distpath dist \
                  tgbot.py

          outputs: type=local,dest=./dist

      - name: Verify binary
        run: |
          file dist/linux_${{ matrix.arch }}/alist-tgbot
          ldd dist/linux_${{ matrix.arch }}/alist-tgbot | grep "not a dynamic executable"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag: ${{ matrix.arch }}
          files: |
            dist/linux_${{ matrix.arch }}/alist-tgbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
