name: Nuitka Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            zig_target: x86_64-linux-musl
          - arch: arm64
            zig_target: aarch64-linux-musl
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Zig
        uses: mlugg/setup-zig@v1.2.1
        with:
          version: "0.12.0"

      - name: Install system compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-x86-64-linux-gnu \
            scons \
            patchelf \
            zlib1g-dev

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install nuitka>=2.6.9 staticx
          pip install -r alist-tgbot-py/requirements.txt

      - name: Build with Nuitka
        env:
          CC: "zig cc -target ${{ matrix.zig_target }}"
          CXX: "zig c++ -target ${{ matrix.zig_target }}"
          LDFLAGS: "-static"
          CFLAGS: "-static -fstack-protector-strong"
        run: |
          cd alist-tgbot-py
          # 确保使用正确的Python解释器
          source ../venv/bin/activate
          which python
          python --version

          # 显式使用虚拟环境的pip安装Nuitka
          python -m pip install --upgrade nuitka staticx
          # 显式设置编译器路径
          export PATH="/usr/bin:$PATH"
          
          # 使用Nuitka编译
          python -m nuitka \
            --onefile \
            --include-package=requests \
            --include-package=urllib3 \
            --include-package=chardet \
            --include-package=idna \
            --include-package=charset_normalizer \
            --standalone \
            --assume-yes-for-downloads \
            --output-dir=./build \
            --lto=no \
            tgbot.py

          # 静态化处理
          staticx --strip ./build/tgbot ./build/tgbot-static

          # 准备输出目录
          mkdir -p ../dist/${{ matrix.arch }}
          mv ./build/tgbot-static ../dist/${{ matrix.arch }}/alist-tgbot-py

      - name: Verify binary
        run: |
          echo "验证 ${{ matrix.arch }} 架构:"
          file ./dist/${{ matrix.arch }}/alist-tgbot-py
          readelf -h ./dist/${{ matrix.arch }}/alist-tgbot-py | grep 'Machine'
          ldd ./dist/${{ matrix.arch }}/alist-tgbot-py 2>&1 | grep "not a dynamic executable"

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ matrix.arch }}"
          BINARY_PATH="./dist/${{ matrix.arch }}/alist-tgbot-py"
          gh release upload "$RELEASE_TAG" "$BINARY_PATH" --clobber
