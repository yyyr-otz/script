name: Static Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build static binary
        uses: docker/build-push-action@v4
        with:
          platforms: linux/${{ matrix.arch }}
          context: .
          file: alist-tgbot/Dockerfile
          outputs: type=local,dest=./dist

      - name: Verify build output
        run: |
          echo "构建产物列表:"
          ls -R ./dist
          echo "验证文件路径:"
          find ./dist -name alist-tgbot

      #- name: Install GitHub CLI
      #  uses: actions/setup-gh-cli@v1  # 关键修复：必须安装CLI工具

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 动态获取二进制文件路径
          BINARY_PATH=$(find ./dist -name alist-tgbot | grep ${{ matrix.arch }})
          
          # 创建架构专属Release
          gh release create ${{ matrix.arch }} \
            --title "AList-TGBot (${{ matrix.arch }})" \
            --notes "Static build for ${{ matrix.arch }}" \
            $BINARY_PATH
