name: 自动文件清理
run-name: ${{ github.actor }} 正在删除指定文件
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '待清理路径（支持 glob 模式，逗号分隔）'
        required: true
      whitelist:
        description: '保护路径（空格分隔）'
        default: 'README.md .github/'

permissions:
  contents: write
  pull-requests: write

jobs:
  secure_clean:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码库
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: 初始化保护
      id: init
      run: |
        # 转换白名单为标准化路径格式
        echo "${{ github.event.inputs.whitelist }}" | tr ' ' '\n' | sed 's|^|./|; s|/*$|/|' > .whitelist
        echo -e "./.git/\n./.github/workflows/" >> .whitelist
        echo "🛡️ 生效白名单："
        cat .whitelist

    - name: 安全清理
      id: cleaner
      env:
        GIT_TRACE: 0
      run: |
        set +eo pipefail  # 禁用所有错误中断
        
        total=0
        IFS=',' read -ra patterns <<< "${{ github.event.inputs.targets }}"
        
        for pattern in "${patterns[@]}"; do
          [[ -z "$pattern" ]] && continue
          echo "::group::🔍 扫描模式: ${pattern//'/'/\\/}"

          sanitized_pattern=${pattern//\/\*\//}
          depth=$(grep -o '/' <<< "$sanitized_pattern" | wc -l)
          find_cmd="find . -maxdepth $((depth+1)) -path './$pattern'"

          count=0
          while IFS= read -r -d $'\0' path; do
            protected=$(grep -m1 -E "^${path%/}/?" .whitelist || true)
            if [ -n "$protected" ]; then
              echo "🛡️ 保护跳过: $path (匹配规则: $protected)"
              continue
            fi

            if rm -rf "$path" &>/dev/null; then
              echo "✅ 删除成功: $path"
              ((count++)) || true
            else
              echo "⚠️ 静默忽略删除失败: $path"
            fi
          done < <(eval "$find_cmd -print0 2>/dev/null" || true)

          echo "✅ 删除完成：共 $count 项"
          ((total+=count)) || true
          echo "::endgroup::"
        done
        
        echo "total_deleted=$total" >> $GITHUB_OUTPUT
        rm -f .whitelist
        
        exit 0  # 强制返回成功状态


    - name: 智能提交
      if: success() || failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "自动清理机器人"
        git config --global user.email "auto-cleanup@users.noreply.github.com"
        
        # 检查是否有需要提交的更改
        if git status --porcelain | grep -q '^[MADRC]'; then
          commit_msg="chore: 自动清理 (${{ steps.cleaner.outputs.total_deleted }}项)"
          
          git add -A
          if git commit -m "$commit_msg"; then
            # 带重试的推送逻辑
            max_retries=3
            for i in $(seq 1 $max_retries); do
              if git push origin HEAD:${{ github.ref_name }} 2>&1 | sed "s/$GH_TOKEN/***/g"; then
                echo "✅ 推送成功"
                break
              else
                echo "🔄 尝试第 $i 次推送失败，等待 3 秒后重试..."
                sleep 3
                git pull --rebase
              fi
            done

            # 推送失败转 PR 方案
            if [ $i -eq $max_retries ]; then
              echo "::warning::推送失败，尝试创建 PR"
              gh pr create \
                --title "$commit_msg" \
                --body "自动生成清理请求" \
                --base ${{ github.ref_name }} \
                --head ${{ github.ref_name }} \
                --label "automated"
            fi
          fi
        else
          echo "🟢 无文件变更"
        fi
