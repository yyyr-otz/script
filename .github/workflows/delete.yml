name: 安全文件清理
on: 
  workflow_dispatch:
    inputs:
      targets:
        description: '待清理路径（支持 glob 模式）'
        required: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 精确路径清理
      run: |
        # 路径解析函数
        parse_pattern() {
          local pattern=$1
          local depth=0
          
          # 替换连续斜杠并去除首尾斜杠
          pattern=$(echo "$pattern" | sed 's#//*#/#g; s#^/##; s#/$##')
          
          # 计算路径深度
          IFS='/' read -ra parts <<< "$pattern"
          for part in "${parts[@]}"; do
            if [[ $part != *"*"* ]]; then
              ((depth++))
            fi
          done
          
          # 生成find参数
          if [[ $pattern == *"**"* ]]; then
            echo "-path './${pattern}' -prune"
          else
            echo "-path './${pattern}' -maxdepth $((depth+1))"
          fi
        }

        # 主清理逻辑
        IFS=',' read -ra patterns <<< "${{ inputs.targets }}"
        for pattern in "${patterns[@]}"; do
          echo "::group::🔄 处理模式: $pattern"
          
          # 生成find参数
          find_args=$(parse_pattern "$pattern")
          
          # 执行查找并删除
          while IFS= read -r -d $'\0' file; do
            if [ -e "$file" ]; then
              rm -v "$file"
            else
              echo "⚠️ 文件不存在: $file"
            fi
          done < <(find . -name . -o -type d -prune -o \
            \( $find_args \) -print0)
          
          echo "::endgroup::"
        done

    - name: 提交变更
      run: |
        git add -A
        git commit -m "清理完成" || echo "无变更可提交"
        git push
