name: 安全文件清理
run-name: ${{ github.actor }} 正在执行清理
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '待清理路径（空格分隔，支持通配符）'
        required: true
        type: string
      whitelist:
        description: '保护路径（空格分隔，支持通配符）'
        required: false
        type: string
        default: '*.md LICENSE .github/ .git/'

permissions:
  contents: write

jobs:
  path-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: 初始化环境
        run: |
          shopt -s globstar extglob nullglob
          echo "::add-mask::${{ inputs.targets }}"

      - name: 设置保护列表
        id: whitelist
        run: |
          declare -a patterns=()
          IFS=' ' read -ra input_patterns <<< "${{ inputs.whitelist }}"
          patterns+=("${input_patterns[@]}")
          
          # 生成保护路径清单文件
          printf "%s\n" "${patterns[@]}" > .whitelist
          echo "保护模式清单："
          cat .whitelist

      - name: 执行清理
        id: cleaner
        run: |
          # 错误处理函数
          handle_error() {
            echo "❌ 错误发生在: $1 (代码:$2)"
            ((error_count++))
            return 0  # 继续执行后续操作
          }

          # 路径保护检查
          is_protected() {
            while IFS= read -r pattern; do
              case "$1" in
                $pattern) return 0 ;;
              esac
            done < .whitelist
            return 1
          }

          # 状态变量初始化
          total_deleted=0
          error_count=0
          protected_count=0

          # 主处理循环
          IFS=' ' read -ra targets <<< "${{ inputs.targets }}"
          for pattern in "${targets[@]}"; do
            echo "::group::🔄 处理模式: $pattern"
            
            # 获取匹配项（安全模式）
            matches=()
            while IFS= read -r -d $'\0'; do
              matches+=("$REPLY")
            done < <(find . -path "./.git" -prune -o -name "$pattern" -print0)

            if [ ${#matches[@]} -eq 0 ]; then
              echo "ℹ️ 无匹配项: $pattern"
            else
              for path in "${matches[@]}"; do
                # 标准化路径格式
                normalized_path="${path#./}"
                normalized_path="${normalized_path%/}"

                if is_protected "$normalized_path"; then
                  echo "🛡️ 保护跳过: $normalized_path"
                  ((protected_count++))
                  continue
                fi

                if [ -e "$path" ]; then
                  if rm -rfv "$path"; then
                    echo "✅ 已清理: $path"
                    ((total_deleted++))
                  else
                    handle_error "$path" $?
                  fi
                else
                  echo "⚠️  幽灵路径: $path"
                fi
              done
            fi
            echo "::endgroup::"
          done

          # 生成状态报告
          echo "total_deleted=$total_deleted" >> $GITHUB_OUTPUT
          echo "error_count=$error_count" >> $GITHUB_OUTPUT
          echo "protected_count=$protected_count" >> $GITHUB_OUTPUT

          # 根据错误状态退出
          if [ $error_count -gt 0 ]; then
            echo "::warning::完成清理但存在 $error_count 个错误"
            exit 0  # 允许继续后续步骤
          fi

      - name: 提交变更
        if: always() && steps.cleaner.outputs.total_deleted > 0
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if ! git diff --quiet; then
            git add -A
            commit_msg="chore: 自动清理 (删除 ${{ steps.cleaner.outputs.total_deleted }} 项)"
            git commit -m "${commit_msg}"
            git push
            echo "🚀 已提交 ${{ steps.cleaner.outputs.total_deleted }} 项变更"
          else
            echo "🟢 无实际变更需要提交"
          fi

      - name: 最终报告
        if: always()
        run: |
          echo "::group::📊 最终统计"
          echo "🗑️ 成功删除: ${{ steps.cleaner.outputs.total_deleted }}"
          echo "🛡️ 保护跳过: ${{ steps.cleaner.outputs.protected_count }}"
          echo "❌ 操作错误: ${{ steps.cleaner.outputs.error_count }}"
          echo "::endgroup::"
          
          if ${{ steps.cleaner.outputs.error_count > 0 }}; then
            echo "::warning::存在 ${{ steps.cleaner.outputs.error_count }} 个非致命错误"
          fi
