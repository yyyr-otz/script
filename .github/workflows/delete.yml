name: 自动文件清理
run-name: ${{ github.actor }} 正在删除指定文件
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '待清理路径（支持 glob 模式）'
        required: true
      whitelist:
        description: '保护路径（空格分隔）'
        default: 'README.md .github/'

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  secure_clean:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码库
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 初始化保护
      id: init
      run: |
        # 生成保护列表文件
        echo "${{ inputs.whitelist }}" | tr ' ' '\n' > .safelist
        echo -e "\n.git/\n.github/workflows/" >> .safelist

    - name: 安全清理
      id: cleaner
      env:
        GIT_TRACE: 0
        GIT_CURL_VERBOSE: 0
      run: |
        # 路径匹配函数
        match_depth() {
          local pattern=$1
          pattern=${pattern//\*\//}
          echo $(grep -o '/' <<< "$pattern" | wc -l)
        }
        # 主清理逻辑
        total=0
        IFS=',' read -ra patterns <<< "${{ inputs.targets }}"
        for pattern in "${patterns[@]}"; do
          echo "::group::🔍 扫描模式: $pattern"
          # 计算匹配深度
          depth=$(match_depth "$pattern")
          find_cmd="find . -maxdepth $((depth+1)) -path './$pattern'"
          # 执行删除
          count=0
          while IFS= read -r -d $'\0' path; do
            if grep -qF "$path" .safelist; then
              echo "🛡️ 保护跳过: $path"
              continue
            fi
            rm -rf "$path"
            echo "✅ 已删除: $path"
            ((count++))
          done < <(eval "$find_cmd -print0 2>/dev/null")
          echo "处理完成，删除 $count 项"
          ((total+=count))
          echo "::endgroup::"
        done
        echo "total_deleted=$total" >> $GITHUB_OUTPUT

    - name: 认证提交
      if: success() || failure()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 配置安全凭据
        git config --global http.https://github.com/.extraheader "Authorization: token ${GH_TOKEN}"
        git config --global user.name "Automated Cleanup"
        git config --global user.email "actions@github.com"
        git remote set-url origin "https://${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        # 执行提交
        if git status --porcelain | grep -q '^[MADRC]'; then
          git add -A
          git commit -m "chore: 自动清理 (${{ steps.cleaner.outputs.total_deleted }}项)"
          # 安全推送（隐藏token）
          { git push origin HEAD:${{ github.ref_name }} 2>&1 | sed "s/${GH_TOKEN}/***/g"; } || {
            echo "::warning::推送失败，尝试创建PR"
            gh pr create --title "清理变更" --body "自动生成" --base ${{ github.ref_name }}
          }
        else
          echo "🟢 无变更需要提交"
        fi
