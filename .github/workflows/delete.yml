name: 安全删除
run-name: ${{ github.actor }} 正在删除指定文件
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '要删除的路径（多个用逗号分隔）'
        required: true

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
    - name: 🛠️ 完全检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 关键参数：完整克隆仓库

    - name: 🔥 执行删除
      run: |
        # 转换输入为数组
        IFS=',' read -ra targets <<< "${{ inputs.targets }}"
        
        # 执行删除并记录变更
        for pattern in "${targets[@]}"; do
          find . -path "./$pattern" -exec git rm --cached -rq {} \; -exec rm -rf {} \; || true
        done

        # 强制更新索引
        git add -u . || true

    - name: 🚀 提交变更
      if: success()
      run: |
        # 配置身份（使用GitHub官方身份）
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        # 智能提交
        if ! git diff-index --quiet HEAD --; then
          git commit -m "删除: ${{ inputs.targets }}"
          git push
        else
          echo "ℹ️ 无实际文件变更"
        fi
