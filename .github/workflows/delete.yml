name: 安全文件清理
run-name: ${{ github.actor }} 正在执行清理
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '待清理路径（空格分隔，支持通配符）'
        required: true
        type: string
      whitelist:
        description: '保护路径（空格分隔，支持通配符）'
        required: false
        type: string
        default: '*.md LICENSE .github/ .git/'

permissions:
  contents: write  # 必须包含写入权限

jobs:
  path-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # 关键配置：保持认证信息
          fetch-depth: 0

      # ... (其他步骤保持不变)

      - name: 提交变更
        if: always() && steps.cleaner.outputs.total_deleted > 0
        run: |
          # 配置Git认证信息
          remote_repo="https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git remote set-url origin "$remote_repo"

          if ! git diff --quiet; then
            git add -A
            commit_msg="chore: 自动清理 (删除 ${{ steps.cleaner.outputs.total_deleted }} 项)"
            git commit -m "${commit_msg}"
            git push origin HEAD:${GITHUB_REF#refs/heads/}  # 推送到当前分支
            echo "🚀 变更已推送"
          else
            echo "🟢 无文件变更"
          fi
