
name: 删除文件
run-name: ${{ github.actor }} 正在删除指定文件
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '待删除路径（空格分隔，支持通配符）'
        required: true
        type: string
      whitelist:
        description: '白名单路径（空格分隔，支持通配符）'
        required: false
        type: string
        default: '*.md LICENSE .github/ .git/'

permissions:
  contents: write

jobs:
  path-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up environment
        run: |
          shopt -s globstar extglob nullglob
          echo "::add-mask::${{ inputs.targets }}"  # 屏蔽敏感信息

      - name: Define whitelist
        run: |
          declare -a whitelist=()
          # 处理默认白名单
          IFS=' ' read -ra default_whitelist <<< "${{ inputs.whitelist }}"
          whitelist+=("${default_whitelist[@]}")
          
          # 将白名单写入环境变量
          echo "whitelist=${whitelist[*]}" >> $GITHUB_ENV

      - name: Delete paths
        run: |
          # 增强白名单检查函数
          is_protected() {
            local path=$1
            for pattern in "${whitelist[@]}"; do
              case "$path" in
                $pattern) return 0 ;;
              esac
            done
            return 1
          }

          IFS=' ' read -ra targets <<< "${{ inputs.targets }}"
          deleted_count=0
          error_count=0

          for pattern in "${targets[@]}"; do
            echo "::group::🔍 处理模式: $pattern"
            
            # 获取匹配项（已处理空匹配）
            matches=($pattern)
            
            if [ ${#matches[@]} -eq 0 ]; then
              echo "ℹ️ 无匹配项: $pattern"
              echo "::endgroup::"
              continue
            fi

            for match in "${matches[@]}"; do
              # 标准化路径格式
              normalized_match="${match%/}"
              
              if is_protected "$normalized_match"; then
                echo "🛡️ 受保护: $match"
                continue
              fi

              if [ -e "$match" ]; then
                if rm -rfv "$match"; then
                  ((deleted_count++))
                  echo "✅ 删除成功: $match"
                else
                  ((error_count++))
                  echo "❌ 删除失败: $match (错误码 $?)" >&2
                fi
              else
                echo "⚠️  路径不存在: $match"
              fi
            done
            
            echo "::endgroup::"
          done

          # 输出汇总报告
          echo "::group::📊 执行结果"
          echo "🗑️ 删除成功总览: $deleted_count 项"
          echo "❌ 删除失败总览: $error_count 项"
          [ $error_count -gt 0 ] && exit 1  # 有错误时返回非零状态码
          echo "::endgroup::"

      - name: Commit and push
        if: success()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: 自动清理 (${{ github.run_id }})"
            git push
            echo "🚀 变更已推送"
          else
            echo "🟢 无文件变更"
          fi
