name: 删除文件
run-name: ${{ github.actor }} 正在删除指定文件
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '待删除路径（空格分隔，支持通配符）'
        required: true
        type: string
      whitelist:
        description: '白名单路径（空格分隔，支持通配符）'
        required: false
        type: string
        default: '*.md LICENSE .github/ .git/'

permissions:
  contents: write

jobs:
  path-cleaner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up environment
        run: |
          # 启用高级通配符功能
          shopt -s globstar extglob nullglob

      - name: Define whitelist
        run: |
          # 定义不允许删除的文件和目录
          declare -a whitelist=(
            "README.md"
            "LICENSE"
            ".github/"
          )
          # 如果用户提供了自定义的白名单，则合并
          if [ -n "${{ inputs.whitelist }}" ]; then
            IFS=' ' read -r -a user_whitelist <<< "${{ inputs.whitelist }}"
            whitelist+=("${user_whitelist[@]}")
          fi

          # 将whitelist写入环境变量供后续步骤使用
          echo "whitelist=${whitelist[*]}" >> $GITHUB_ENV

      - name: Delete paths
        run: |
          # 从输入中获取要删除的路径列表
          IFS=' ' read -r -a paths <<< "${{ inputs.targets }}"

          # 读取白名单
          whitelist=(${whitelist//,/ })

          # 记录开始前的文件系统状态
          echo "📁 初始工作区内容:"
          ls -lR

          # 执行删除操作
          deleted_count=0
          for pattern in "${paths[@]}"; do
            echo "🕵️ 正在进行操作: $pattern"
            
            # 查找所有匹配项
            matches=( $pattern )
            
            if [ ${#matches[@]} -eq 0 ]; then
              echo "⚠️  没有与此匹配的项: $pattern"
              continue
            fi

            # 遍历匹配项
            for match in "${matches[@]}"; do
              # 检查是否在白名单中
              if [[ " ${whitelist[*]} " =~ " ${match} " ]]; then
                echo "🚫 跳过白名单: $match"
                continue
              fi

              if [ -e "$match" ]; then
                rm -rf "$match"
                ((deleted_count++))
                echo "✅ 成功删除: $match"
              else
                echo "🔍 未找到: $match (after pattern expansion)"
              fi
            done
          done

          echo "🗑️ 已删除项目总览: $deleted_count"

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 检测变更
          if git diff --quiet; then
            echo "🟢 未检测到变更"
          else
            git add --all
            git commit -m "任务: 自动删除 (${{ github.run_id }})"
            git push
            echo "🚀 已成功推送更改"
          fi
